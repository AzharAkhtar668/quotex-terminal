<script>
    let socket = null;
    let currentServerEpoch = Math.floor(Date.now() / 1000);
    let currentGranularity = 60;
    let liveCandles = [];
    let currentSymbol = "frxEURUSD";
    
    let consecutiveLosses = 0;
    let currentWins = 0;
    let isSessionLocked = false;
    let mtfFilterOn = true;
    let newsFilterOn = true;
    let logDataArray = [];

    window.onload = function() {
        setTimeout(() => {
            resizeCanvas();
            initQuotexConnection();
            calculateStake();
            setInterval(updateTimer, 1000);
        }, 300);
        window.addEventListener('resize', resizeCanvas);
    };

    function toggleFilter(type) {
        if (type === 'mtf') {
            mtfFilterOn = !mtfFilterOn;
            const btn = document.getElementById('mtf-toggle');
            btn.innerText = mtfFilterOn ? 'ON' : 'OFF';
            btn.className = mtfFilterOn ? 'toggle-btn active' : 'toggle-btn';
        } else if (type === 'news') {
            newsFilterOn = !newsFilterOn;
            const btn = document.getElementById('news-toggle');
            btn.innerText = newsFilterOn ? 'ON' : 'OFF';
            btn.className = newsFilterOn ? 'toggle-btn active' : 'toggle-btn';
        }
    }

    function calculateStake() {
        const bal = parseFloat(document.getElementById('capital-bal').value) || 0;
        const risk = parseFloat(document.getElementById('risk-pct').value) || 0;
        const safeStake = (bal * (risk / 100)).toFixed(2);
        document.getElementById('safe-stake-val').innerText = `$${safeStake}`;
    }

    function changePair() {
        currentSymbol = document.getElementById('pair-selector').value;
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ forget_all: "candles" }));
            socket.send(JSON.stringify({
                ticks_history: currentSymbol,
                adjust_start_time: 1,
                count: 50,
                end: "latest",
                start: 1,
                style: "candles",
                granularity: currentGranularity,
                subscribe: 1
            }));
        }
    }

    function changeTimeframe(sec, label) {
        currentGranularity = sec;
        const badge = document.getElementById('tf-badge');
        if (badge) badge.innerText = label;
        
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ forget_all: "candles" }));
            socket.send(JSON.stringify({
                ticks_history: currentSymbol,
                adjust_start_time: 1,
                count: 50,
                end: "latest",
                start: 1,
                style: "candles",
                granularity: currentGranularity,
                subscribe: 1
            }));
        }
    }

    function initQuotexConnection() {
        if (socket) { try { socket.close(); } catch(e) {} }
        
        // Secure WebSocket URL for HTTPS hosting
        socket = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
        
        socket.onopen = () => {
            const dot = document.getElementById('status-dot');
            if(dot) dot.style.background = '#10b981';
            socket.send(JSON.stringify({ ping: 1 }));
            changePair();
        };
        
        socket.onmessage = (msg) => {
            try {
                const data = JSON.parse(msg.data);
                if (data.msg_type === 'ping') {
                    setTimeout(() => {
                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({ ping: 1 }));
                        }
                    }, 10000);
                }
                if (data.msg_type === 'candles') {
                    liveCandles = data.candles.map(c => ({
                        open: parseFloat(c.open),
                        high: parseFloat(c.high),
                        low: parseFloat(c.low),
                        close: parseFloat(c.close),
                        epoch: parseInt(c.epoch)
                    }));
                    drawChart();
                }
                if (data.msg_type === 'ohlc') {
                    const ohlc = data.ohlc;
                    if (ohlc) {
                        const newCandle = {
                            open: parseFloat(ohlc.open),
                            high: parseFloat(ohlc.high),
                            low: parseFloat(ohlc.low),
                            close: parseFloat(ohlc.close),
                            epoch: parseInt(ohlc.open_time)
                        };
                        if (liveCandles.length > 0 && liveCandles[liveCandles.length - 1].epoch === newCandle.epoch) {
                            liveCandles[liveCandles.length - 1] = newCandle;
                        } else {
                            liveCandles.push(newCandle);
                            if (liveCandles.length > 60) liveCandles.shift();
                        }
                        drawChart();
                    }
                }
            } catch(e) {}
        };
        
        socket.onclose = () => {
            const dot = document.getElementById('status-dot');
            if(dot) dot.style.background = '#ef4444';
            setTimeout(initQuotexConnection, 5000);
        };
    }

    function resizeCanvas() {
        const canvas = document.getElementById('live-crypto-canvas');
        const container = document.getElementById('chart-container');
        if (!container || !canvas) return;
        
        canvas.width = container.clientWidth || 460;
        canvas.height = container.clientHeight || 320;
        drawChart();
    }

    function drawChart() {
        const canvas = document.getElementById('live-crypto-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        // Background Grid
        ctx.strokeStyle = '#0e1420';
        ctx.lineWidth = 1;
        for (let i = 40; i < width; i += 40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
        }
        for (let i = 40; i < height; i += 40) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
        }

        if (liveCandles.length === 0) {
            ctx.fillStyle = '#64748b';
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('LOADING LIVE CANDLE DATA...', width / 2, height / 2);
            return;
        }

        const visibleCandles = liveCandles.slice(-35);
        let minPrice = Infinity, maxPrice = -Infinity;

        visibleCandles.forEach(c => {
            if (c.low < minPrice) minPrice = c.low;
            if (c.high > maxPrice) maxPrice = c.high;
        });

        const priceRange = (maxPrice - minPrice) || 0.0001;
        const candleWidth = (width - 60) / visibleCandles.length;

        visibleCandles.forEach((c, index) => {
            const x = index * candleWidth + 20;
            const yHigh = height - ((c.high - minPrice) / priceRange) * (height - 40) - 20;
            const yLow = height - ((c.low - minPrice) / priceRange) * (height - 40) - 20;
            const yOpen = height - ((c.open - minPrice) / priceRange) * (height - 40) - 20;
            const yClose = height - ((c.close - minPrice) / priceRange) * (height - 40) - 20;

            const isGreen = c.close >= c.open;
            const color = isGreen ? '#22c55e' : '#ef4444';

            // Wick
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x + candleWidth / 2, yHigh);
            ctx.lineTo(x + candleWidth / 2, yLow);
            ctx.stroke();

            // Body
            ctx.fillStyle = color;
            const bodyTop = Math.min(yOpen, yClose);
            const bodyHeight = Math.max(Math.abs(yOpen - yClose), 2);
            ctx.fillRect(x + 2, bodyTop, candleWidth - 4, bodyHeight);
        });
    }

    function updateTimer() {
        currentServerEpoch++;
        const rem = currentGranularity - (currentServerEpoch % currentGranularity);
        const countEl = document.getElementById('countdown');
        if (countEl) countEl.innerText = rem + 's';
    }

    function exportLogsCSV() {
        if (logDataArray.length === 0) {
            alert('Export ke liye koi logs data mojood nahi hai!');
            return;
        }
        let csvContent = "data:text/csv;charset=utf-8,Time,Pair,Signal,Status\n";
        logDataArray.forEach(row => {
            csvContent += `${row.time},${row.pair},${row.signal},${row.status}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Quotex_Terminal_Logs_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function clearAllLogs() {
        const rows = document.getElementById('log-rows');
        if (rows) rows.innerHTML = '';
        logDataArray = [];
        consecutiveLosses = 0;
        currentWins = 0;
        isSessionLocked = false;
        document.getElementById('session-lock-banner').classList.add('hidden');
        ['stat-total', 'stat-wins', 'stat-losses', 'stat-refunds'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.innerText = '0';
        });
    }
</script>
